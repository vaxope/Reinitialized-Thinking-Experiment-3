# configs/slime_container.toml: every pin of the slime training image for DeltaAI (GH200, arm64).
#
# Purpose : the training counterpart of configs/control.toml [container]. slime publishes
#           x86-only images, so we build our own Apptainer image: slime's own base image
#           (SGLang v0.5.21, which has an arm64 build) plus ONLY what Qwen3.5-2B GRPO needs,
#           at the versions slime @ 79aa41a pins in its docker/Dockerfile.
# Read by : scripts/deltaai/build_slime.sbatch, which passes every value below to
#           containers/slime_gh200.def as --build-arg. No version lives in the recipe itself.
#           tests/test_slime_container.py checks the recipe uses every pin and nothing else.
# Plan    : vault decisions/2026-11-17-slime-container-plan.md (user approved the lean plan,
#           2026-11-17). Left out (not used by Qwen3.5-2B): DeepEP, DeepGEMM, mamba-ssm,
#           causal-conv1d, mooncake, modelopt, tilelang (GLM-5 only), flash-attn-3, apex, int4
#           kernels, cuda-compat (DeltaAI's driver 595 is new enough).
# Rule    : changing a pin means a new image file name ([output] sif_name) and a new hash.

[base]
# slime's base image | slime docker/Dockerfile `ARG SGLANG_IMAGE_TAG=v0.5.21` | the SGLang version
# slime's patches are written for. Training rollouts use it; GPQA evaluation keeps using the
# pinned v0.5.23 control image (configs/control.toml), so baseline and trained model are
# evaluated by the same engine.
image = "lmsysorg/sglang"
tag = "v0.5.21"
# linux/arm64 manifest digest | Docker Hub API, read 2026-11-17 (14.8 GB) | the recipe pulls by
# digest, so a re-pushed tag can't change what we build on.
digest_arm64 = "sha256:1f176b3a1dd1205d2a462ab80ea9fc17769a32e53cb6f3c690efa2dc2c384977"

[slime]
repo = "https://github.com/THUDM/slime.git"
# The commit studied for the plan (2026-11-06) and referenced in CLAUDE.md.
commit = "79aa41a884ab0bf65222c94418f6357d3c31192b"
# slime's patch set for this SGLang version (slime docker/patch/<patch_set>/).
patch_set = "v0.5.21"
# Megatron patches, applied in this order (slime Dockerfile; megatron.patch is required).
megatron_patches = ["megatron.patch", "megatron-sglang-aligned.patch"]
# SGLang patches, applied in this order to the SGLang source in the base image (slime Dockerfile).
sglang_patches = ["sglang.patch", "sglang-top_p.patch", "sglang-release_hicache.patch",
                  "sglang-pull_weights.patch", "sglang-deterministic.patch",
                  "sglang-radio_layerscale.patch", "sglang-nemotron-multi-image.patch"]
# Packages removed from slime's requirements.txt before it is installed | ["sunabako"] |
# build job 3616837 (2026-11-17) failed on it after 1 h 38 min: sunabako (sandboxes for slime's
# coding-agent example) has only x86_64 wheels, and its source package hard-codes
# target = "x86_64-unknown-linux-gnu" in .cargo/config.toml, so it cannot compile on arm64.
# slime @ 79aa41a imports it only in examples/coding_agent_rl/, never in slime/ or train.py.
# The recipe fails if a listed name is not in requirements.txt (no silent no-op).
skip_requirements = ["sunabako"]

[pins]
# All from slime @ 79aa41a docker/Dockerfile unless noted.
megatron_repo = "https://github.com/NVIDIA/Megatron-LM.git"
megatron_commit = "ae76c60e6c35d913867d6dd7bad0f30b128b54e7"
transformer_engine = "2.18.0"
# Qwen3.5's gated-delta (linear-attention) layers in training (slime_plugins/models/qwen_gdn_backend.py "fla").
flash_linear_attention = "0.5.2"
# Megatron's async checkpointing (its `dev` extra; slime pins it equal to Megatron's).
nvidia_resiliency_ext = "0.7.0"
# Lets SGLang release GPU memory while Megatron trains (slime --colocate).
torch_memory_saver_repo = "https://github.com/zhuzilin/torch_memory_saver.git"
torch_memory_saver_commit = "bdab8c55f490a00a746ec34e301391617f5ca878"
# NCCL runtime slime tested.
nccl = "2.30.7"
# slime's Dockerfile installs an x86-only fork wheel; the upstream PyPI package has arm64 wheels.
# 0.3.2 = the fork's base version and the version slime's GB10 (arm64) port used (docker/NOTES_GB10.md #12).
sglang_router = "0.3.2"
# Scientific stack slime pins after resolving its requirements.
numpy = "2.3.5"
scipy = "1.18.1"
pyarrow = "25.0.1"
kernels_below = "0.15.0"

[build]
# GPU architecture to compile for | 9.0 (sm90) | DeltaAI GH200 = Hopper | compiling one
# architecture instead of slime's three (9.0, 10.0, 10.3) shortens the build.
torch_cuda_arch_list = "9.0"
transformer_engine_cuda_archs = "90"
# Parallel compile jobs | 32 | half of the 64 CPUs the build job requests, because each CUDA
# compile can take several GB of RAM (the SGLang image build peaked at 67.5 GB, job 3610890).
max_jobs = 32
# Tiny image for the first step of the build job: a seconds-long test build that shows whether
# DeltaAI allows unprivileged (fakeroot) builds BEFORE the 15 GB base image is downloaded.
# busybox 1.36.1 = a small, long-lived official Docker Hub image; its content doesn't matter.
fakeroot_test_image = "busybox:1.36.1"

[output]
# Image file, inside the folder given by SLIME_SIF_DIR (scripts/deltaai/env.sh).
sif_name = "slime-79aa41a-sglang0.5.21-gh200.sif"
# SHA-256 of the built .sif | empty until the first successful build prints it; copy it here
# (as with configs/control.toml [container] sif_sha256). Training refuses a different file.
sif_sha256 = ""
